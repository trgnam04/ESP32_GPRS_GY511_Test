[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
lib_deps = 
	mikalhart/TinyGPSPlus @ 1.1.0
	adafruit/Adafruit Unified Sensor@^1.1.15
	; adafruit/Adafruit ADXL345@^1.3.4 ; acc
	; adafruit/Adafruit L3GD20 U@^2.0.3 ; gyro
	; adafruit/Adafruit HMC5883 Unified@^1.2.3 ; mag
	adafruit/Adafruit MPU6050@^2.2.6
	; amcewen/HttpClient@^2.2.0
	; thingsboard/ThingsBoard@^0.15.0
    ; mathieucarbou/ESPAsyncWebServer@^3.6.0
    ; SPIFFS@2.0.0
    WiFi@2.0.0
	electroniccats/MPU6050@^1.4.1
lib_ldf_mode = deep

[env:wemos_d1_mini32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
lib_deps = 
	mikalhart/TinyGPSPlus @ 1.1.0
	adafruit/Adafruit Unified Sensor@^1.1.15
	adafruit/Adafruit ADXL345@^1.3.4 ; acc
	adafruit/Adafruit L3GD20 U@^2.0.3 ; gyro
	adafruit/Adafruit HMC5883 Unified@^1.2.3 ; mag
	; amcewen/HttpClient@^2.2.0
	; thingsboard/ThingsBoard@^0.15.0
    ; mathieucarbou/ESPAsyncWebServer@^3.6.0
    ; SPIFFS@2.0.0
    ; WiFi@2.0.0
	adafruit/Adafruit LSM303DLHC@^1.0.4
lib_ldf_mode = deep